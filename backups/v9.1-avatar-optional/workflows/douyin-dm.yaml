# 工作流: 抖音私信
# 2026-05-11 v9 — 头像改用 resource-id 抗布局漂移
#
# v9 关键修复 (v8 → v9):
#   - 点头像从 tap_xy (绝对像素 987,1100) 改为 tap_resource_id (com.ss.android.ugc.aweme:id/user_avatar)
#   - 根因: 视频带"合集 / 商品挂件 / 直播预告"时右侧栏整体上下浮动,绝对像素必然落空
#     实测嘉嘉的家 (带合集) 头像 bounds 上移 121px,(987,1100) 落到点赞按钮上
#   - 代价: 多 ~200ms,但视频带挂件类型全部能稳定命中
#   - 失败诊断: rpa_mvp.py 已加 per_item 失败时自动 dump screen+xml 到 _fail_*
#
# v8 修复 (历史):
#   1. 第一个视频卡片 tap_xy y=0.20 → 0.36 (旧坐标落在过滤条上,从来没点中)
#      实测卡片可点击层 q3e bounds=[12,495][534,1191] 中心 (273, 843)
#   2. 进主页用"点头像"代替"左滑"
#      左滑实测被抖音互动浮层(感兴趣评论区/留言联系)吸收, 失败率高
#
# 标定方法: 冷启 douyin → 每步 adb input tap + uiautomator dump → 取 bounds 中心
# 标定截图: outputs/calibration/01..13_*.png

meta:
  name: "抖音私信"
  description: "v9 resource-id 抗漂移版: 搜词 → 进视频 → 关注 → 点头像(按id) → 发私信 → 上滑"
  version: 9

device:
  serial:

app:
  package: com.ss.android.ugc.aweme
  name: douyin

workflow:
  keyword: "北京海淀二手房"
  max_items: 3
  wait_after_action: 0.3

  # === 打开搜索 ===
  open_search:
    # 冷启后等抖音加载到首页 (实测 5s 够,慢机/弱网调到 6-7s)
    - action: wait
      seconds: 5
    # 点右上角搜索 (放大镜) — desc="搜索" bounds=[916,64][1072,196] 中心 (994, 130)
    - action: tap_xy
      x: 0.9204         # 994/1080
      y: 0.0556         # 130/2340
    - action: wait
      seconds: 1.0

  # === 提交搜索 → 进第一个视频 ===
  submit_search:
    # 输入框自动聚焦,直接 send_keys 即可
    - action: input_text
      value_from: keyword
    - action: wait
      seconds: 0.5
    # 点右上角"搜索"提交 — bounds=[894,72][1080,204] 中心 (987, 138)
    - action: tap_xy
      x: 0.9139         # 987/1080
      y: 0.0590         # 138/2340
    - action: wait
      seconds: 2.0
    # 点"视频"tab — bounds=[240,239][330,300] 中心 (285, 269)
    - action: tap_xy
      x: 0.2639         # 285/1080
      y: 0.1150         # 269/2340
    - action: wait
      seconds: 1.8
    # 点第一个视频卡片 — q3e bounds=[12,495][534,1191] 中心 (273, 843)
    # 之前 y=0.20 (468) 落在过滤条上, 从来没点中过
    - action: tap_xy
      x: 0.2528         # 273/1080
      y: 0.3603         # 843/2340  ← 关键修复
    - action: wait
      seconds: 3.5
    - action: screenshot
      name: first_video

  # === 每个候选: 视频页关注 → 点头像进主页 → 发私信 ===
  per_item:
    # 1. 视频页 tap 关注 — desc="关注" clickable=true bounds=[897,1130][1080,1217] 中心 (988, 1173)
    #    用 tap_desc 是因为它失败=已关注, optional 跳过更优雅
    - action: tap_desc
      value: "关注"
      clickable: true
      optional: true
    - action: wait
      seconds: 0.8

    # 2. 点头像进主页 — 按 resource-id 找 user_avatar 实时取 bounds
    #    v8 用绝对像素 (987,1100),在带合集/挂件的视频里因右侧栏整体上移而落到点赞按钮
    #    resource-id 抗漂移: 无论视频是否带挂件,user_avatar 这个 id 永远在 UI 树里
    #    代价: 比 tap_xy 慢 ~200ms (要先抓 UI 树)
    #    optional: 新版抖音 step 1 tap_desc 实测会直接跳到博主主页 + R8 混淆掉了 user_avatar id,
    #    这一步在主页找不到 id 必然失败,但 step 3 tap_text "发私信" 在主页能直接命中
    - action: tap_resource_id
      value: "com.ss.android.ugc.aweme:id/user_avatar"
      clickable: true
      optional: true
    - action: wait
      seconds: 2.0

    # 3. 点"发私信" — text="发私信" clickable=true bounds=[540,1107][1014,1251] 中心 (777, 1179)
    #    用 tap_text + 坐标兜底两层保险
    - action: tap_text
      value: "发私信"
    - action: wait
      seconds: 1.2

    # 4. 点聊天输入框 — msg_et bounds=[143,2191][695,2312] 中心 (419, 2251)
    - action: tap_xy
      x: 0.3880         # 419/1080
      y: 0.9620         # 2251/2340
    - action: wait
      seconds: 0.4

    # 5. 输入话术
    - action: input_text
      value_from: dm_template
    - action: wait
      seconds: 0.5

    # 6. 点发送 — desc="发送" clickable=true bounds=[887,2191][1058,2312] 中心 (972, 2251)
    - action: tap_xy
      x: 0.9000         # 972/1080
      y: 0.9620         # 2251/2340
    - action: wait
      seconds: 1.2

    # 7. 发送证据截图
    - action: screenshot
      name: dm_sent

    # 8. back × 2: 聊天 → 主页 → 视频
    - action: press
      key: back
    - action: wait
      seconds: 0.4
    - action: press
      key: back
    - action: wait
      seconds: 0.6

    # 9. 上滑切下一条视频 — (540,1825) -> (540,515) duration 400ms
    - action: swipe
      start: [0.5000, 0.7799]   # 540/1080, 1825/2340
      end:   [0.5000, 0.2201]   # 540/1080,  515/2340
      duration: 0.4
    - action: wait
      seconds: 1.5

drafts:
  dm_template: "您好，我这里有一些北京的买房客户，可以先免费给您一条，预算和需求都明确。合适的话后面再长期对接，您看可以吗？"
